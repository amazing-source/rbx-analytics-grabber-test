<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Indigo LiveOps</title>
<style>
  :root {
    --bg:#0f0e17; --surface:#161524; --surface-2:#1d1b2e; --surface-3:#252238;
    --border:#282540; --border-2:#332f4d;
    --ink:#eceaf5; --ink-2:#a49dbd; --ink-3:#726b8c;
    --violet:#7c5cff; --violet-2:#6d4ff5; --violet-wash:rgba(124,92,255,.13);
    --up:#3ddc97; --down:#ff6b5b; --warn:#f5c451;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font:14px/1.5 'Builder Sans','Gotham SSm',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 24px 64px; }
  .tnum { font-variant-numeric:tabular-nums; }

  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
  .brand { display:flex; align-items:center; gap:11px; }
  .logo { width:36px; height:36px; border-radius:11px; background:linear-gradient(160deg,#8468ff,#5b3ce8);
          display:grid; place-items:center; font-weight:700; font-size:15px; color:#fff; }
  .brand h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.1px; }
  .brand p { margin:1px 0 0; font-size:11.5px; color:var(--ink-3); }
  .me { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
        border-radius:99px; padding:5px 16px 5px 5px; }
  .me img { width:34px; height:34px; border-radius:99px; background:var(--surface-2); }
  .me b { display:block; font-size:13px; font-weight:600; }
  .me span { display:block; font-size:11px; color:var(--ink-3); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; }
  .lbl { font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:9px; }

  input,select { font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--border-2);
                 border-radius:10px; padding:9px 12px; outline:none; }
  input::placeholder { color:var(--ink-3); }
  input:focus,select:focus { border-color:var(--violet); }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; }
  .btn { background:linear-gradient(180deg,#8468ff,#6d4ff5); color:#fff; font-weight:600; padding:10px 20px; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn-ghost { background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border); padding:10px 16px; }

  /* group picker */
  .picker { position:relative; }
  .picker>button { display:flex; align-items:center; gap:11px; width:340px; text-align:left;
                   background:var(--surface); border:1px solid var(--border); padding:9px 12px; }
  .picker img,.pemb { width:32px; height:32px; border-radius:9px; background:var(--surface-2); flex:none; object-fit:cover; }
  .pname { font-size:13.5px; font-weight:600; }
  .psub { font-size:11px; color:var(--ink-3); }
  .menu { position:absolute; z-index:50; margin-top:8px; width:360px; background:var(--surface);
          border:1px solid var(--border-2); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden; }
  .menu-search { padding:9px; border-bottom:1px solid var(--border); }
  .menu-search input { width:100%; }
  .menu-list { max-height:330px; overflow:auto; padding:6px; }
  .menu-list button { display:flex; align-items:center; gap:11px; width:100%; text-align:left;
                      background:transparent; color:var(--ink); padding:8px 9px; }
  .menu-list button:hover { background:var(--surface-2); }
  .sect { font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
          color:var(--ink-3); padding:9px 9px 5px; }

  /* games */
  .grid { display:grid; gap:15px; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); }
  .game { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;
          text-align:left; padding:0; color:var(--ink); transition:transform .14s, border-color .14s; }
  .game:hover { transform:translateY(-2px); border-color:var(--border-2); }
  .game .thumb { aspect-ratio:16/10; background:var(--surface-2); width:100%; object-fit:cover; display:block; }
  .game .meta { padding:12px 13px 13px; }
  .game .nm { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .game .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; }
  .pill { font-size:10.5px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap; }
  .pill.ok{background:rgba(61,220,151,.14);color:var(--up)} .pill.denied{background:rgba(255,107,91,.14);color:var(--down)}
  .pill.error{background:rgba(245,196,81,.14);color:var(--warn)} .pill.idle{background:var(--surface-2);color:var(--ink-3)}
  .live { font-size:11.5px; color:var(--ink-2); }
  .dot { width:6px;height:6px;border-radius:99px;background:var(--up);display:inline-block;margin-right:5px;vertical-align:1px; }

  /* modal */
  .scrim { position:fixed; inset:0; background:rgba(6,5,12,.66); display:grid; place-items:center; z-index:100; padding:20px; }
  .modal { width:100%; max-width:540px; max-height:88vh; overflow:auto; background:var(--surface);
           border:1px solid var(--border-2); border-radius:18px; padding:22px; }
  .opt { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--surface-2);
         padding:13px; margin-bottom:9px; color:var(--ink); }
  .opt.on { background:var(--violet-wash); }
  .sw { width:38px;height:21px;border-radius:99px;background:var(--border-2);padding:2px;flex:none;transition:background .16s; }
  .opt.on .sw { background:var(--violet); }
  .sw i { display:block;width:17px;height:17px;border-radius:99px;background:#fff;transition:transform .16s; }
  .opt.on .sw i { transform:translateX(17px); }
  .opt b { display:block;font-size:13.5px;font-weight:600; }
  .opt span { display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.45; }
  .chips { display:flex;flex-wrap:wrap;gap:6px;margin-top:10px; }
  .chip { background:var(--surface);border:1px solid var(--border-2);color:var(--ink-2);padding:6px 11px;font-size:12px;font-weight:600; }
  .chip.on { background:var(--violet); border-color:var(--violet); color:#fff; }

  .muted { color:var(--ink-3); font-size:12.5px; }
  .banner { border-radius:12px; padding:12px 14px; font-size:12.5px; margin-bottom:18px; }
  .banner.warn { background:rgba(245,196,81,.1); border:1px solid rgba(245,196,81,.25); color:var(--warn); }
  .spin { width:15px;height:15px;border:2px solid var(--ink-3);border-top-color:transparent;border-radius:99px;
          display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .rise { animation:rise .3s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2e2a44;border-radius:99px;border:2px solid var(--bg)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">I</div>
        <div><h1>Indigo LiveOps</h1><p id="sub">Portfolio watch</p></div>
      </div>
      <div id="me"></div>
    </header>
    <div id="banners"></div>
    <div id="stage"></div>
  </div>
  <div id="modal-root"></div>
  <script src="dashboard.js"></script>
</body>
</html>
