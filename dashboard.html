<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Indigo LiveOps</title>
<style>
  :root {
    --bg:#0d0d10; --rail:#111114; --surface:#17171c; --surface-2:#1e1e25; --surface-3:#26262f;
    --border:#26262e; --border-2:#333340;
    --ink:#f2f2f5; --ink-2:#a6a6b3; --ink-3:#6f6f80;
    --violet:#7c5cff; --violet-2:#6d4ff5; --violet-wash:rgba(124,92,255,.14);
    --up:#3ddc97; --down:#ff6b5b; --warn:#f5c451;
    --rail-w:232px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink); display:flex; min-height:100%;
    font:14px/1.5 'Builder Sans','Gotham SSm',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .tnum { font-variant-numeric:tabular-nums; }
  .muted { color:var(--ink-3); font-size:12.5px; }

  /* ---------- left rail ---------- */
  .rail { width:var(--rail-w); flex:none; background:var(--rail); border-right:1px solid var(--border);
          display:flex; flex-direction:column; padding:14px 12px; gap:4px; }
  .rail .top { display:flex; align-items:center; gap:9px; padding:6px 8px 14px; }
  .logo { width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#8468ff,#5b3ce8);
          display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none; }
  .wordmark { font-size:13.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }

  /* group switcher, Creator-Hub style */
  .gsw { position:relative; margin-bottom:10px; }
  .gsw>button { display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
                border:0;color:var(--ink);border-radius:10px;padding:7px 8px;cursor:pointer; }
  .gsw>button:hover { background:var(--surface-2); }
  .gsw img,.emb { width:26px;height:26px;border-radius:7px;background:var(--surface-2);flex:none;object-fit:cover; }
  .gsw .nm { font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .caret { color:var(--ink-3);font-size:11px;flex:none; }
  .menu { position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:296px;background:var(--surface);
          border:1px solid var(--border-2);border-radius:13px;box-shadow:0 24px 64px rgba(0,0,0,.65);overflow:hidden; }
  .menu-search { padding:8px;border-bottom:1px solid var(--border); }
  .menu-list { max-height:340px;overflow:auto;padding:6px; }
  .menu-list button { display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
                      color:var(--ink);padding:7px 8px;border:0;border-radius:9px;cursor:pointer; }
  .menu-list button:hover { background:var(--surface-2); }
  .sect { font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:9px 8px 5px; }

  .rail hr { border:0;border-top:1px solid var(--border);margin:10px 4px; }
  .rail .foot { margin-top:auto;padding:8px; }
  .me { display:flex;align-items:center;gap:9px; }
  .me img { width:30px;height:30px;border-radius:99px;background:var(--surface-2); }
  .me b { display:block;font-size:12.5px;font-weight:600; }
  .me span { display:block;font-size:11px;color:var(--ink-3); }

  /* ---------- main ---------- */
  main { flex:1;min-width:0;overflow:auto;padding:26px 30px 60px; }
  h2 { font-size:21px;margin:0 0 2px;font-weight:650;letter-spacing:-.2px; }
  .sub { font-size:12.5px;color:var(--ink-3);margin-bottom:20px; }

  /* games — thumbnail led, name underneath, lifts on hover */
  .grid { display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(186px,1fr)); }
  .gcard { display:block;width:100%;text-align:left;background:transparent;border:0;padding:0;
           color:var(--ink);cursor:pointer; }
  .gthumb { position:relative;display:block;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
            background:var(--surface-2);border:1px solid var(--border);
            transition:transform .18s cubic-bezier(.22,1,.36,1), border-color .18s, box-shadow .18s; }
  .gthumb img { width:100%;height:100%;object-fit:cover;display:block; }
  .gcard:hover .gthumb { transform:scale(1.04);border-color:var(--border-2);
                         box-shadow:0 14px 32px rgba(0,0,0,.5); }
  .gcard:active .gthumb { transform:scale(1.01); }
  .gcard .gname { display:block;margin-top:9px;padding:0 2px;font-size:13px;font-weight:600;
                  line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink); }
  /* the access marker sits on the art, so the line under it stays just the name */
  .pill { position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;border-radius:99px;
          padding:3px 8px;white-space:nowrap;backdrop-filter:blur(6px); }
  .pill.ok{background:rgba(61,220,151,.22);color:#7ef0bd} .pill.denied{background:rgba(255,107,91,.24);color:#ff9c91}
  .pill.warn{background:rgba(245,196,81,.22);color:#ffd97a} .pill.idle{background:rgba(255,255,255,.1);color:#d2d2dd}
  .pill.watch{background:rgba(124,92,255,.3);color:#cdbfff}

  input,select { font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--border-2);
                 border-radius:10px;padding:9px 12px;outline:none;width:100%; }
  input::placeholder { color:var(--ink-3); }
  input:focus,select:focus { border-color:var(--violet); }
  button { font:inherit; }
  .btn { background:linear-gradient(180deg,#8468ff,#6d4ff5);color:#fff;font-weight:600;padding:10px 20px;
         border:0;border-radius:10px;cursor:pointer; }
  .btn:disabled { opacity:.4;cursor:default; }
  .btn-ghost { background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);padding:9px 15px;
               border-radius:10px;cursor:pointer; }

  .banner { border-radius:11px;padding:11px 14px;font-size:12.5px;margin-bottom:16px; }
  .banner.warn { background:rgba(245,196,81,.09);border:1px solid rgba(245,196,81,.24);color:var(--warn); }
  .banner.err { background:rgba(255,107,91,.09);border:1px solid rgba(255,107,91,.26);color:var(--down);
                font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-word; }

  .scrim { position:fixed;inset:0;background:rgba(5,5,9,.7);display:grid;place-items:center;z-index:200;padding:22px; }
  .modal { width:100%;max-width:540px;max-height:88vh;overflow:auto;background:var(--surface);
           border:1px solid var(--border-2);border-radius:17px;padding:22px; }
  .lbl { font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px; }
  .opt { display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);
         padding:13px;margin-bottom:9px;color:var(--ink);border:0;border-radius:10px;cursor:pointer; }
  .opt.on { background:var(--violet-wash); }
  .sw { width:38px;height:21px;border-radius:99px;background:var(--border-2);padding:2px;flex:none;transition:background .16s; }
  .opt.on .sw { background:var(--violet); }
  .sw i { display:block;width:17px;height:17px;border-radius:99px;background:#fff;transition:transform .16s; }
  .opt.on .sw i { transform:translateX(17px); }
  .opt b { display:block;font-size:13.5px;font-weight:600; }
  .opt span { display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.45; }
  .chips { display:flex;flex-wrap:wrap;gap:6px;margin-top:10px; }
  .chip { background:var(--surface);border:1px solid var(--border-2);color:var(--ink-2);padding:6px 11px;
          font-size:12px;font-weight:600;border-radius:9px;cursor:pointer; }
  .chip.on { background:var(--violet);border-color:var(--violet);color:#fff; }

  .spin { width:14px;height:14px;border:2px solid var(--ink-3);border-top-color:transparent;border-radius:99px;
          display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .rise { animation:rise .28s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2c2c36;border-radius:99px;border:2px solid var(--bg)}

  @media (max-width:820px){ .rail{display:none} main{padding:20px} }
</style>
</head>
<body>
  <aside class="rail">
    <div class="top"><div class="logo">I</div><div class="wordmark">LiveOps</div></div>
    <div class="gsw" id="gsw"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <div id="err"></div>
    <div id="banners"></div>
    <h2 id="title">Experiences</h2>
    <div class="sub" id="subtitle"></div>
    <div id="stage"></div>
  </main>
  <div id="modal-root"></div>
  <script src="dashboard.js"></script>
</body>
</html>
